name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/StickersDeVideo.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: StickersDeVideo-apk
          path: salida/StickersDeVideo.apk
